<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COCO Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "New Hybrid Method (Hario Switch)",
        "description": "Tetsu Kasaya's evolved hybrid recipe for the Hario Switch combining immersion, pour-over, and cool immersion.",
        "recipeCategory": "Coffee",
        "recipeCuisine": "Coffee",
        "recipeYield": "300g",
        "image": "/assets/images/goran-ivos-1JsjRW6Sbwg-unsplash.jpg",
        "recipeIngredient": [
          "Coffee beans 20g",
          "Water 300g"
        ],
        "recipeInstructions": [
          { "@type": "HowToStep", "text": "Close and pour to 60g (bloom)." },
          { "@type": "HowToStep", "text": "Open and pour to 120g." },
          { "@type": "HowToStep", "text": "Pour to 210g and cool to 70℃." },
          { "@type": "HowToStep", "text": "Close and pour to 300g." },
          { "@type": "HowToStep", "text": "Open and wait until it drains." },
          { "@type": "HowToStep", "text": "Finish." }
        ],
        "video": {
          "@type": "VideoObject",
          "name": "New Hybrid Method",
          "embedUrl": "https://www.youtube.com/embed/4FeUp_zNiiY"
        }
      }
    </script>
  </body>
</html>
