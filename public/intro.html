<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COCO Timer</title>
    <link rel="stylesheet" href="./intro.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./settings-common.css" />
  </head>
  <body>
    <div class="app">
      <div id="shared-header"></div>

      <main class="content">
        <section class="card hero-card">
          <img
            class="hero-image"
            src="/assets/images/goran-ivos-1JsjRW6Sbwg-unsplash.jpg"
            alt="New Hybrid Method"
          />
          <div class="hero-title" id="recipe-title">新しいハイブリッドメソッド</div>
          <div class="hero-desc" id="recipe-desc"></div>
        </section>

        <section class="card">
          <div class="card-title" id="label-youtube">動画で確認</div>
          <div class="video-wrap">
            <iframe
              id="youtube"
              src="https://www.youtube.com/embed/4FeUp_zNiiY"
              title="YouTube video player"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>
        </section>

        <div class="actions">
          <button class="btn primary" id="start-btn">始める</button>
          <button class="btn ghost" id="skip-btn">スキップ</button>
        </div>
      </main>
    </div>

    <div id="shared-settings-root"></div>

    <script type="module" src="./intro.js"></script>
  </body>
</html>
