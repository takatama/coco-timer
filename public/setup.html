<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COCO Timer</title>
    <link rel="stylesheet" href="/setup.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/settings-common.css" />
  </head>
  <body>
    <div class="app">
      <div id="shared-header"></div>

      <main class="content">
        <section class="card">
          <div class="card-title" id="label-beans">豆の量</div>
          <div class="stepper-row">
            <button class="btn-icon" id="beans-minus" aria-label="decrease">
              −
            </button>
            <div class="beans-value" id="beans-value">20g</div>
            <button class="btn-icon" id="beans-plus" aria-label="increase">
              ＋
            </button>
          </div>
        </section>

        <section class="card">
          <div class="card-title" id="label-flavor">味わい</div>
          <div class="choice-row" id="flavor-choices">
            <button class="choice" data-value="sweet">甘味</button>
            <button class="choice" data-value="neutral">バランス</button>
            <button class="choice" data-value="sour">酸味</button>
          </div>
        </section>

        <button class="btn-primary" id="start-btn">タイマーを開始</button>

        <details class="card" id="recipe-details">
          <summary class="details-summary"><span id="label-details">レシピの説明</span><span class="details-summary-link" id="recipe-details-link">詳細</span></summary>
          <div class="details-body">
            <img
              class="details-image"
              src="/assets/images/goran-ivos-1JsjRW6Sbwg-unsplash.jpg"
              alt="New Hybrid Method"
            />
            <div class="details-text" id="details-text"></div>
            <div class="details-video">
              <iframe
                id="details-youtube"
                src="https://www.youtube.com/embed/4FeUp_zNiiY"
                title="YouTube video player"
                frameborder="0"
                allow="
                  accelerometer;
                  autoplay;
                  clipboard-write;
                  encrypted-media;
                  gyroscope;
                  picture-in-picture;
                "
                allowfullscreen
              ></iframe>
            </div>
          </div>
        </details>

        <section class="card equipment-card" aria-labelledby="label-equipment">
          <div class="equipment-header">
            <h2 class="card-title equipment-title" id="label-equipment">必要な器具</h2>
          </div>
          <ul class="equipment-list" id="equipment-list"></ul>
        </section>

        <section class="card">
          <div class="card-title" id="label-steps">ステップごとの湯量</div>
          <div class="hint" id="total-water">合計: 300g</div>
          <div class="step-list" id="step-list"></div>
        </section>

        <p class="affiliate-note" id="affiliate-note">
          Amazonのアソシエイトとして、COCO Timerは適格販売により収入を得ています。
        </p>
      </main>
    </div>

    <div id="shared-settings-root"></div>

    <script type="module" src="./setup.js"></script>
  </body>
</html>
