<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrewSteps Setup</title>
    <link rel="stylesheet" href="./setup.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <header class="app-bar">
        <div class="app-title">BrewSteps</div>
      </header>

      <main class="content">
        <section class="card">
          <div class="card-title">豆の量</div>
          <div class="stepper-row">
            <button class="btn-icon" id="beans-minus" aria-label="decrease">−</button>
            <div class="beans-value" id="beans-value">20g</div>
            <button class="btn-icon" id="beans-plus" aria-label="increase">＋</button>
          </div>
        </section>

        <section class="card">
          <div class="card-title">味わい</div>
          <div class="choice-row" id="flavor-choices">
            <button class="choice" data-value="sweet">甘味</button>
            <button class="choice" data-value="neutral">バランス</button>
            <button class="choice" data-value="sour">酸味</button>
          </div>
        </section>

        <button class="btn-primary" id="start-btn">タイマーを開始</button>

        <section class="card">
          <div class="card-title">ステップごとの湯量</div>
          <div class="hint" id="total-water">合計: 300g</div>
          <div class="step-list" id="step-list"></div>
        </section>
      </main>
    </div>

    <script src="./setup.js"></script>
  </body>
</html>
