<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COCO Timer</title>
  </head>
  <body>
    <script type="module">
      import { buildLocalizedPagePath, detectLanguage, extractLangFromPath } from "/i18n-routing.js";

      const safeStorageGet = (key) => {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      };

      const { pathname, search, hash } = window.location;

      if (pathname === "/") {
        const lang = detectLanguage();
        window.location.replace(`/${lang}/${search}${hash}`);
      } else {
        const langFromUrl = extractLangFromPath(pathname);
        const isLanguageRoot = /^\/(ja|en)\/?$/.test(pathname);

        if (langFromUrl && isLanguageRoot) {
          detectLanguage();
          const introSeen = safeStorageGet("brewsteps_intro_seen") === "1";
          const destination = introSeen
            ? buildLocalizedPagePath(langFromUrl, "setup")
            : buildLocalizedPagePath(langFromUrl, "intro");
          if (window.location.pathname !== destination) {
            window.location.replace(destination);
          }
        } else {
          detectLanguage();
        }
      }
    </script>
  </body>
</html>
