<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COCO Timer</title>
  </head>
  <body>
    <script>
      const currentUrl = new URL(window.location.href);
      let seen = null;
      try {
        seen = localStorage.getItem("brewsteps_intro_seen");
      } catch {
        seen = null;
      }

      const target = seen ? "./setup.html" : "./intro.html";
      const targetUrl = new URL(target, currentUrl);

      // Guard against self-redirect loops when this file is served for other routes.
      if (
        targetUrl.pathname !== currentUrl.pathname ||
        targetUrl.search !== currentUrl.search ||
        targetUrl.hash !== currentUrl.hash
      ) {
        window.location.replace(targetUrl.toString());
      }
    </script>
  </body>
</html>
