<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COCO Timer</title>
  </head>
  <body>
    <script type="module">
      import { detectLanguage } from "/i18n-routing.js";

      const safeStorageGet = (key) => {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      };

      const langFromUrl = detectLanguage();
      if (!langFromUrl) {
        // detectLanguage already redirected.
      } else {
        const introSeen = safeStorageGet("brewsteps_intro_seen") === "1";
        const destination = introSeen ? `/${langFromUrl}/setup` : `/${langFromUrl}/intro`;
        if (window.location.pathname !== destination) {
          window.location.replace(destination);
        }
      }
    </script>
  </body>
</html>
