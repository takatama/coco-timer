<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COCO Timer</title>
  </head>
  <body>
    <script type="module">
      import { buildLocalizedPagePath, detectLanguage } from "/i18n-routing.js";

      // Single redirect responsibility:
      // only "/" performs redirect, and it goes directly to localized setup.
      if (window.location.pathname === "/") {
        const lang = detectLanguage();
        window.location.replace(buildLocalizedPagePath(lang, "setup"));
      } else {
        // No redirects for non-root pages.
        detectLanguage();
      }
    </script>
  </body>
</html>
